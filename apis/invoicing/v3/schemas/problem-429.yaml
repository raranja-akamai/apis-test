type: object
description: |-
  Specifies the errors.
  
x-akamai:
  file-path: schemas/problem-429.yaml
additionalProperties: true
properties:
  type:
    type: string
    description: |
      The type of error, a non-navigable URI.
  title:
    type: string
    description: |
      Title of the error.
  details:
    type: string
    description: |
      More information about the error.
  rateLimit:
    type: integer
    description: |
      The total number of requests allowed.
  rateLimitNextRequest:
    type: string
    description: |
      The time when you can next make another request.
    format: date-time
  rateLimitRemaining:
    type: integer
    description: |
      Remaining requests available.
  rateLimitReset:
    type: string
    description: |
      The time when the `rateLimitRemaining` will return to the original `rateLimit`.
    format: date-time
  status:
    type: integer
    description: |
      HTTP status code.
