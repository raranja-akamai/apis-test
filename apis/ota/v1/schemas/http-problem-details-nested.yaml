type: object
description: |-
  Specifies nested details of an error response.
  
x-akamai:
  file-path: schemas/http-problem-details-nested.yaml
additionalProperties: true
required:
- code
- message
properties:
  code:
    type: string
    description: |
      The unique code for an error.
    minLength: 1
  data:
    type: object
    description: |
      An object map with details about rejected values.
  field:
    type: string
    description: |
      A request parameter, path variable, or request body field that caused an error.
    minLength: 1
  message:
    type: string
    description: |
      A human-readable summary of the problem type.
    minLength: 1
