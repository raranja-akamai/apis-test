additionalProperties: false
description: 'Describes the range of query options available for each report.

  '
properties:
  available:
    description: 'When enabled, indicates the report can be executed by the current
      user.

      '
    type: boolean
  businessObjectName:
    description: 'The name of the object by which data is queried.

      '
    type: string
  dataRetentionDays:
    description: 'The number of days for which this report''s data is available.

      '
    type: integer
  deprecated:
    description: 'When enabled, indicates that this is an older version of the report.

      '
    type: boolean
  filters:
    description: 'The set of available filters available for this report.

      '
    items:
      additionalProperties: false
      properties:
        fullDescription:
          description: 'Provides documentation describing the available filter.

            '
          type: string
        name:
          description: 'The name of the available filter.

            '
          type: string
        required:
          description: 'When enabled, you need to specify this filter when executing
            the report.

            '
          type: boolean
        type:
          description: 'The type of data this filter expects, either arbitrary `int`
            or `string`, or a fixed `enum` specified by `values`.

            '
          enum:
          - string
          - int
          - enum
          type: string
        values:
          description: 'When the `type` of filter is `enum`, this lists available
            values.

            '
          items:
            additionalProperties: false
            properties:
              fullDescription:
                description: 'Where necessary, provides documentation describing the
                  enumerated value.

                  '
                type: string
              value:
                description: 'Specifies each enumerated string value.

                  '
                type: string
            required:
            - value
            type: object
          type: array
      type: object
    type: array
  fullDescription:
    description: 'Documentation that describes this report.

      '
    type: string
  groupBy:
    description: 'This indicates names of columns by which reported data is grouped.
      It''s reflected in the generated report''s metadata.

      '
    items:
      type: string
    type: array
  groupOutlyingValues:
    additionalProperties: false
    description: 'Specifies this report''s support for grouping outlying values under
      a single category.

      '
    properties:
      enabled:
        description: 'Indicates whether this report allows you to group outlying values.

          '
        type: boolean
      groupName:
        default: Other
        description: 'Indicates the default category name under which outlying values
          group within a single category. You can provide your own name to override
          this default.

          '
        type: string
      groupThreshold:
        default: 9
        description: 'Indicates the default number of categories to report on separately
          before grouping under a single category. You can provide your own threshold
          value to override this default.

          '
        type: integer
    required:
    - enabled
    type: object
  intervals:
    description: 'Specifies the set of available spans of time to aggregate data by.
      Use one of these values as the `interval` query parameter when executing the
      report.

      '
    items:
      type: string
    type: array
  limit:
    description: 'The default number of data rows included for this report.

      '
    type: integer
  links:
    description: 'Specifies dynamic hypermedia links to report-generating operations.

      '
    items:
      additionalProperties: false
      properties:
        href:
          description: 'The hypermedia URL linking the API resource.

            '
          type: string
        method:
          default: GET
          description: 'The HTTP method to call the `href` link with. If unspecified,
            uses the GET method.

            '
          type: string
        rel:
          description: 'Identifies the type of resource.

            '
          type: string
      required:
      - href
      - rel
      type: object
    type: array
  maxLimit:
    description: 'The maximum number of data rows permitted for this report.

      '
    type: integer
  metrics:
    description: 'The set of available metrics available for this report.

      '
    items:
      additionalProperties: false
      properties:
        fullDescription:
          description: 'Provides documentation describing the available metric.

            '
          type: string
        name:
          description: 'The name of the available metric.

            '
          type: string
      required:
      - name
      type: object
    type: array
  name:
    description: 'Specifies the name of the report.

      '
    type: string
  outputType:
    description: 'The report type. Either `HIERARCHICAL` with two columns you can
      group data by, with the first being Time, or `FLAT`.

      '
    enum:
    - FLAT
    - HIERARCHICAL
    type: string
  requiredProducts:
    description: 'If specified, this lists any product you need to execute the report.

      '
    items:
      type: string
    type: array
  requiredRoles:
    description: 'Information about required role to run this report.

      '
    items:
      description: 'A set of permissions, any of which you need to execute the report.
        Some permissions may correspond to specific `requiredProducts`.

        '
      type: string
    type: array
  status:
    description: 'Whether this version of the report is `PUBLISHED` or `DEPRECATED`.
      Selecting `DEPRECATED` enables the `deprecated` JSON member.

      '
    enum:
    - PUBLISHED
    - DEPRECATED
    type: string
  supportsPagination:
    description: 'Allows to use `page` and `pageSize` parameters to retrieve non aggregated
      data.

      '
    type: boolean
  timeBased:
    description: 'Groups report results by time.

      '
    type: boolean
  version:
    description: 'The version of this report.

      '
    type: integer
required:
- available
- dataRetentionDays
- deprecated
- intervals
- name
- requiredRoles
- status
- version
type: object
x-akamai:
  file-path: schemas/report-list-row.yaml
