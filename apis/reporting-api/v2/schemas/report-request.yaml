additionalProperties: false
description: 'Specifies available metrics for the report type, filters to reduce the
  data, and a set of objects to report on.

  '
properties:
  filters:
    description: 'Specifies a set of custom filters, with each filter''s name keying
      an array with each filter''s set of values. The set of available filters depends
      on the type of report.

      '
    type: object
  metrics:
    description: 'The set of desired metrics. The set of available metrics depends
      on the type of report. If omitted, the report includes all available metrics.

      '
    items:
      type: string
    type: array
  objectIds:
    description: 'Unique IDs for the given object type you want to report on.

      '
    items:
      type: string
    type: array
required:
- objectIds
type: object
x-akamai:
  file-path: schemas/report-request.yaml
