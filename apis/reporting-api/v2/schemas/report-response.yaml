additionalProperties: false
description: 'Encapsulates the response report, including aggregated data and reflecting
  details on the request.

  '
properties:
  data:
    description: 'Array of objects representing data rows suitable for aggregation.
      The value of the `groupBy` array always appears as a key for each row to indicate
      by which metric it is grouped and sorted.

      '
    items:
      $ref: data-row-schema.yaml
    type: array
  metadata:
    $ref: metadata-schema.yaml
  summaryStatistics:
    $ref: kpi-result-schema.yaml
required:
- data
- metadata
- summaryStatistics
type: object
x-akamai:
  file-path: schemas/report-response.yaml
