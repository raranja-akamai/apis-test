type: object
description: |-
  ACL version and rule set traffic data.
  
x-akamai:
  file-path: schemas/single-acl-version-response.yaml
additionalProperties: false
required:
- description
- version
- accountId
- state
- ruleSet
- createdBy
- createdTimestamp
- updatedBy
- updatedTimestamp
properties:
  description:
    type: string
    description: |
      A description of the version.
    minLength: 1
  version:
    type: integer
    description: |
      Version number.
    minimum: 1
  accountId:
    type: string
    description: |
      Account ID.
    minLength: 1
  createdBy:
    type: string
    description: |
      The user who created the version.
    minLength: 1
  createdTimestamp:
    type: string
    description: |
      ISO 8601 timestamp marking the version's creation.
    minLength: 1
  ruleSet:
    type: array
    description: |
      The rules within the rule set.
    minItems: 0
    items:
      type: object
      additionalProperties: false
      required:
      - index
      - aclText
      - ruleUuid
      - ipVersion
      - comment
      properties:
        aclText:
          type: string
          description: |
            ACL user text.
          minLength: 1
        comment:
          type: string
          description: |
            User-provided comments.
          minLength: 1
        index:
          type: integer
          description: |
            The ACL rule order.
          minimum: 1
        ipVersion:
          type: string
          description: |
            The IP version, either `V4` or `V6`.
          enum:
          - V4
          - V6
        ruleUuid:
          type: string
          description: |
            A unique rule ID.
          minLength: 1
  state:
    type: string
    description: |
      ACL version state. Either `CONFIGURATION`, `DEPLOYED`, or `DEPRECATED`.
    enum:
    - CONFIGURATION
    - DEPLOYED
    - DEPRECATED
  updatedBy:
    type: string
    description: |
      The user who updated the version.
    nullable: true
    minLength: 1
  updatedTimestamp:
    type: string
    description: |
      ISO 8601 timestamp marking the version's last update.
    nullable: true
    minLength: 1
