type: object
description: |-
  Deployment details.
  
x-akamai:
  file-path: schemas/etp-configuration-deployment-specific.yaml
additionalProperties: false
required:
- comment
- deployedBy
- id
- message
- progressPct
- startTime
- status
properties:
  id:
    type: integer
    description: |
      Unique identifier of the deployment.
    minimum: 1
  comment:
    type: string
    description: |
      User comment provided for deployment.
    minLength: 1
  deployedBy:
    type: string
    description: |
      __Read-only__ User who initiated the deployment.
    readOnly: true
    minLength: 1
  endTime:
    type: string
    description: |
      __Read-only__ ISO 8601 timestamp marking when the deployment completed.
    readOnly: true
    format: date-time
  message:
    type: string
    description: |
      Deployment details.
    minLength: 1
  progressPct:
    type: integer
    description: |
      Indicates the deployment progress in percentage.
    minimum: 0
    maximum: 100
  startTime:
    type: string
    description: |
      __Read-only__ Start time of the deployment.
    readOnly: true
    format: date-time
  status:
    type: string
    description: |
      Specifies deployment status. Either `CONTENT_EXTERNAL`, `REVERTING`, `STAGING`, `PENDING`, `RUNNING`, `COMPLETED`, `FAILED`, `BUILDING`, or `AUTO_RKS_ONLY`.
    enum:
    - CONTENT_EXTERNAL
    - REVERTING
    - STAGING
    - PENDING
    - RUNNING
    - COMPLETED
    - FAILED
    - BUILDING
    - AUTO_RKS_ONLY
