type: object
description: |-
  Lists AUP categories with their details.
  
x-akamai:
  file-path: schemas/aup-categories.yaml
additionalProperties: false
required:
- name
- id
- defaultActionId
- code
- deprecated
properties:
  id:
    type: integer
    description: |
      __Read-only__ A unique identifier for the category.
    readOnly: true
    minimum: 1
  name:
    type: string
    description: |
      Name of the response.
    minLength: 1
  avcVendorCode:
    type: string
    description: |
      The vendor code for the AVC entity.
    minLength: 1
  code:
    type: string
    description: |
      The unique code for the AUP.
    minLength: 0
  defaultActionId:
    type: integer
    description: |
      __Read-only__ Action ID on the AUP category.
    readOnly: true
    minimum: 1
  deprecated:
    type: boolean
    description: |
      Deprecates the AUP.
  isDeployable:
    type: boolean
    description: |
      Indicates if the AVC entity is deployable.
  riskId:
    type: integer
    description: |
      __Read-only__ Identifies the risk level for the AUP category.
    readOnly: true
    minimum: 1
  subCategories:
    type: array
    description: |
      A nested AUP object type.
    minItems: 0
    items:
      $ref: aup-categories-nested.yaml
  vendorCode:
    type: string
    description: |
      Unique identifier of the vendor.
    minLength: 1
