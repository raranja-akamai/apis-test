type: object
description: |-
  Contains data loss protection (DLP) dictionary regular expression entry details.
  
x-akamai:
  file-path: schemas/regex-specific.yaml
additionalProperties: false
required:
- id
- regex
properties:
  id:
    type: string
    description: |
      __Read-only__ Unique identifier for the regular expression entry.
    readOnly: true
    minLength: 1
  createdBy:
    type: string
    description: |
      Name of the user who created the regular expression entry.
    minLength: 1
  createdDate:
    type: string
    description: |
      __Read-only__ ISO 8601 timestamp marking the regular expression entry's creation.
    readOnly: true
    format: date-time
  modifiedBy:
    type: string
    description: |
      __Read-only__ Name of the user to last modify the regex entry.
    readOnly: true
    minLength: 1
  modifiedDate:
    type: string
    description: |
      __Read-only__ ISO 8601 timestamp marking the regular expression entry's last modification.
    readOnly: true
    format: date-time
  regex:
    type: string
    description: |
      Contents of the regular expression entry.
    minLength: 1
