type: object
description: |-
  Provides global settings details.
  
x-akamai:
  file-path: schemas/global-settings-update-request.yaml
additionalProperties: false
required:
- blockRoamingTraffic
properties:
  asnExceptions:
    type: array
    description: |
      List of AS number exceptions.
    minItems: 0
    uniqueItems: true
    items:
      type: integer
      description: |
        AS number.
      minimum: 1
      maximum: 4294967294
  blockRoamingTraffic:
    type: boolean
    description: |
      Blocks roaming traffic.
  enableChinaRegion:
    type: boolean
    description: |
      Enables the China region for the deployment.
  enableHttpsErrorPage:
    type: boolean
    description: |
      Enables display of HTTPS block pages for DNS only policies.
  enableSourceIpBind:
    type: boolean
    description: |
      Enables the source IP binding.
  globalSettingsId:
    type: integer
    description: |
      __Read-only__ The unique ID for the global setting.
    readOnly: true
    minimum: 1
  quicklistMigrated:
    type: boolean
    description: |
      Migrates `quickList`.
