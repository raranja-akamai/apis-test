type: array
description: |-
  Group policy properties.
  
x-akamai:
  file-path: schemas/group-policies.yaml
items:
  type: object
  additionalProperties: false
  required:
  - order
  - groups
  - policyId
  properties:
    groups:
      type: array
      description: |
        The groups the policy mapping applies to.
      items:
        type: string
    order:
      type: integer
      description: |
        The policy mapping priority order.
    policyId:
      type: integer
      description: |
        The unique ID of the policy mapped to the group.
    policyInfo:
      type: object
      description: |
        Policy information.
      additionalProperties: false
      properties:
        id:
          type: integer
          description: |
            The policy ID.
        name:
          type: string
          description: |
            The policy name.
