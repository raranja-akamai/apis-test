type: object
description: |-
  Contains file type info properties.
  
x-akamai:
  file-path: schemas/file-type-info.yaml
additionalProperties: false
required:
- name
- id
- category
- defaultActionId
- deprecated
- code
properties:
  id:
    type: integer
    description: |
      __Read-only__ Lists the file ID.
    readOnly: true
    minimum: 1
  name:
    type: string
    description: |
      The filename.
    minLength: 1
  category:
    type: string
    description: |
      The file category.
    minLength: 1
  code:
    type: string
    description: |
      The file's code.
    minLength: 1
  defaultActionId:
    type: integer
    description: |
      __Read-only__ The file's default action ID.
    readOnly: true
    minimum: 1
  deprecated:
    type: boolean
    description: |
      Deprecates the file.
