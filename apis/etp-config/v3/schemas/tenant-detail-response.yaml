type: object
description: |-
  Tenant onboard request details.
  
x-akamai:
  file-path: schemas/tenant-detail-response.yaml
additionalProperties: false
required:
- name
- id
- users
properties:
  id:
    type: integer
    description: |
      Unique identifier for the tenant.
    minimum: 1
  name:
    type: string
    description: |
      Unique name for the tenant.
    minLength: 1
  createdBy:
    type: string
    description: |
      Name of the user who created this tenant.
  createdDate:
    type: string
    description: |
      ISO 8601 timestamp marking the tenant's creation.
  groupIds:
    type: array
    description: |
      Group identifiers with access to the tenant.
    minItems: 0
    items:
      type: integer
      minimum: 1
  hideSetupWizard:
    type: boolean
    description: |
      Hides the setup wizard.
  inheritClientConfig:
    type: boolean
    description: |
      Whether to inherit the client configuration from the parent.
  inheritErrorPage:
    type: boolean
    description: |
      Whether to inherit the error page from the tenant's parent.
  inheritNetworkConfig:
    type: boolean
    description: |
      Whether to inherit the network configuration from the parent.
  modifiedBy:
    type: string
    description: |
      Name of the user who most recently modified this tenant.
  modifiedDate:
    type: string
    description: |
      ISO 8601 timestamp marking this site's last modification.
  policyTemplateId:
    type: integer
    description: |
      __Read-only__ Identifies the tenant's policy template.
    readOnly: true
    minimum: 1
  users:
    type: array
    description: |
      Array of assigned tenant users.
    minItems: 0
    items:
      $ref: tenant-user.yaml
  viewerUsers:
    type: array
    description: |
      Array of tenant viewer users.
    minItems: 0
    items:
      $ref: tenant-user.yaml
