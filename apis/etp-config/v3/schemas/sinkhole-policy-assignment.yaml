type: object
description: |-
  Replaces the current security connector, or optionally deletes the current security connector.
  
x-akamai:
  file-path: schemas/sinkhole-policy-assignment.yaml
additionalProperties: false
required:
- newId
- deleteSinkhole
properties:
  aupResponseId:
    type: integer
    description: |
      __Read-only__ The unique identifier of the new custom response.
    readOnly: true
    minimum: 1
  deleteSinkhole:
    type: boolean
    description: |
      Deletes the current security connector.
  newId:
    type: integer
    description: |
      The unique identifier for the new security connector.
    minimum: 1
