type: object
description: |-
  DLP patterns.
  
x-akamai:
  file-path: schemas/dlp-pattern-get.yaml
additionalProperties: false
required:
- id
- name
- regexes
properties:
  id:
    type: string
    description: |
      Unique identifier for the DLP pattern.
  name:
    type: string
    description: |
      Name of the DLP pattern.
  akamaiDefined:
    type: boolean
    description: |
      Whether the DLP pattern is Akamai-defined. If `true`, you can't delete the pattern.
  createdBy:
    type: string
    description: |
      Name of the user who created this DLP pattern.
  createdDate:
    type: string
    description: |
      __Read-only__ ISO 8601 timestamp of this DLP pattern's creation.
    readOnly: true
    format: date-time
  modifiedBy:
    type: string
    description: |
      Name of the user who last modified the DLP pattern.
  modifiedDate:
    type: string
    description: |
      __Read-only__ ISO 8601 timestamp marking this DLP pattern's last modification.
    readOnly: true
    format: date-time
  regexIds:
    type: array
    description: |
      Unique identifier for the DLP pattern.
    minItems: 0
    items:
      type: string
  regexes:
    type: array
    description: |
      Configured DLP regular expressions to match traffic.
    minItems: 1
    items:
      $ref: regex-specific.yaml
