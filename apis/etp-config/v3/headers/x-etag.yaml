description: |-
  Use the `X-etag` string returned in the response header as `If-Match` in write requests to avoid overwriting edits by any other API clients. See [Concurrency control](ref:concurrency-control) for details.
  
x-akamai:
  file-path: headers/x-etag.yaml
schema:
  type: string
  example: '"a9dfe78cf93090516bde891d009eaf57"'
