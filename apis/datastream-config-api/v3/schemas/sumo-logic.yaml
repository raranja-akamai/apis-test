additionalProperties: false
description: 'Details the Sumo Logic destination that you can use in your stream.
  If you choose this destination, the stream pushes a sample POST request to the endpoint
  to validate write access. For `STRUCTURED` logs, the data appears as `0,access_validation`,
  and for `JSON` it''s `{"access_validation":true}`. You can see the data only if
  the destination validates, and you can access the destination storage.

  '
properties:
  collectorCode:
    description: 'The unique HTTP collector code of your Sumo Logic endpoint.

      '
    type: string
  compressLogs:
    default: true
    description: 'Enables gzip compression for a log file sent to a destination. The
      value is `true` by default.

      '
    type: boolean
  contentType:
    description: 'The type of the resource passed in the request''s custom header.
      For details, see the additional options discussed in [Stream logs to Sumo Logic](doc:stream-sumo-logic#additional-options).

      '
    type: string
  customHeaderName:
    description: 'A human-readable name for the request''s custom header, containing
      only alphanumeric, dash, and underscore characters. For details, see the additional
      options discussed in [Stream logs to Sumo Logic](doc:stream-sumo-logic#additional-options).

      '
    type: string
  customHeaderValue:
    description: 'The custom header''s contents passed with the request that contains
      information about the client connection. For details, see the additional options
      discussed in [Stream logs to Sumo Logic](doc:stream-sumo-logic#additional-options).

      '
    type: string
  destinationType:
    description: 'The destination type''s name. Set this value to `SUMO_LOGIC` for
      this destination type.

      '
    enum:
    - SUMO_LOGIC
    type: string
  displayName:
    description: 'The destination''s name.

      '
    type: string
  endpoint:
    description: 'The Sumo Logic HTTP Source URL where you want to send your logs.
      You should follow the `https://<SumoEndpoint>/receiver/v1/http` format and set
      the collector code in the `collectorCode` member. You can use hostnames served
      over the Akamai network as endpoint URLs. See [Stream logs to Sumo Logic](doc:stream-sumo-logic#akamaized-hostname-as-endpoint),
      and [Upload Metrics to an HTTP Source](https://help.sumologic.com/docs/send-data/hosted-collectors/http-source/upload-metrics/)
      in the Sumo Logic documentation.

      '
    type: string
required:
- destinationType
- displayName
- endpoint
- collectorCode
title: SUMO_LOGIC
type: object
x-akamai:
  file-path: schemas/sumo-logic.yaml
