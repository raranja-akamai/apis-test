additionalProperties: false
description: 'Provides detailed information about a Sumo Logic connector that you
  can use in your stream.

  '
properties:
  collectorCode:
    description: 'The unique HTTP collector code of your Sumo Logic endpoint.

      '
    type: string
  compressLogs:
    default: true
    description: 'Enables gzip compression for a log file sent to a destination. If
      not set, this member''s value is `true` by default.

      '
    type: boolean
  connectorId:
    description: 'Identifies the connector associated with the data stream.

      '
    type: integer
  connectorName:
    description: 'The name of the connector.

      '
    type: string
  connectorType:
    description: 'The name of the connector type. Set this value to `SUMO_LOGIC` for
      this connector type.

      '
    enum:
    - SUMO_LOGIC
    type: string
  contentType:
    description: 'The type of the resource passed in the request''s custom header.

      '
    type: string
  customHeaderName:
    description: 'A human-readable name for the request''s custom header, containing
      only alphanumeric, dash, and underscore characters.

      '
    type: string
  customHeaderValue:
    description: 'The custom header''s contents passed with the request that contains
      information about the client connection.

      '
    type: string
  endpoint:
    description: 'The Sumo Logic collection endpoint where you want to send your logs.
      You should follow the `https://<SumoEndpoint>/receiver/v1/http` format, and
      enter the collector code in the `collectorCode` member. You can use Akamaized
      property hostnames as endpoint URLs. See [Stream logs to Sumo Logic](doc:stream-sumo-logic#akamaized-hostname-as-endpoint),
      and [Upload Metrics to an HTTP Source](https://help.sumologic.com/docs/send-data/hosted-collectors/http-source/upload-metrics/)
      in the Sumo Logic documentation.

      '
    type: string
required:
- connectorId
- connectorType
- connectorName
- endpoint
- compressLogs
title: SUMO_LOGIC
type: object
x-akamai:
  file-path: schemas/sumo-logic-saved-connector.yaml
