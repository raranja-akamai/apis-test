additionalProperties: false
description: 'Provides basic information about the latest version of a stream. Apart
  from contextual information and the activation status, it provides names of the
  properties the stream monitors.

  '
properties:
  contractId:
    description: 'Identifies the contract the stream belongs to.

      '
    type: string
  createdBy:
    description: 'The username who created the stream.

      '
    type: string
  createdDate:
    description: 'An ISO 8601 timestamp marking when the stream was created.

      '
    format: date-time
    type: string
  groupId:
    description: 'Identifies the group where the stream is created.

      '
    type: integer
  latestVersion:
    description: 'Identifies the latest version of the stream.

      '
    type: integer
  modifiedBy:
    description: 'The username who modified the stream.

      '
    type: string
  modifiedDate:
    description: 'An ISO 8601 timestamp marking when the stream was modified.

      '
    format: date-time
    type: string
  streamId:
    description: 'Identifies the stream.

      '
    type: integer
  streamName:
    description: 'The stream''s name.

      '
    type: string
  streamStatus:
    description: 'Indicates if the stream version is `INACTIVE`, `ACTIVATING`, `ACTIVATED`,
      `DEACTIVATING`, or `DEACTIVATED`.

      '
    enum:
    - INACTIVE
    - ACTIVATING
    - ACTIVATED
    - DEACTIVATING
    - DEACTIVATED
    type: string
  streamVersion:
    description: 'Identifies the stream''s version.

      '
    type: integer
required:
- contractId
- createdBy
- createdDate
- groupId
- latestVersion
- modifiedBy
- modifiedDate
- streamId
- streamName
- streamStatus
- streamVersion
type: object
x-akamai:
  file-path: schemas/stream-ew.yaml
