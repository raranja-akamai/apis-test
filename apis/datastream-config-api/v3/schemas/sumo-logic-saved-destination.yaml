additionalProperties: false
description: 'Details the Sumo Logic destination that you can use in your stream.
  If you choose this destination, the stream pushes a sample POST request to the endpoint
  to validate write access. For `STRUCTURED` logs, the data is sent as `0,access_validation`,
  and for `JSON` it''s `{"access_validation":true}`. You can see the data only if
  the destination validates, and you can access the destination storage.

  '
properties:
  collectorCode:
    description: 'The unique HTTP collector code of your Sumo Logic endpoint.

      '
    type: string
  compressLogs:
    default: true
    description: 'Enables gzip compression for a log file sent to a destination. The
      value is `true` by default.

      '
    type: boolean
  contentType:
    description: 'The type of the resource passed in the custom header of the request.

      '
    type: string
  customHeaderName:
    description: 'A human-readable name for the custom header of the request that
      can contain only alphanumeric, dash, and underscore characters. See [Stream
      logs to Sumo Logic](doc:stream-sumo-logic) for details.

      '
    type: string
  customHeaderValue:
    description: 'The contents of the custom header passed with the request that contain
      information about the client connection. See [Stream logs to Sumo Logic](doc:stream-sumo-logic)
      for details.

      '
    type: string
  destinationType:
    description: 'The destination type''s name. Set this value to `SUMO_LOGIC` for
      this destination type.

      '
    enum:
    - SUMO_LOGIC
    type: string
  displayName:
    description: 'The destination''s name.

      '
    type: string
  endpoint:
    description: 'The Sumo Logic HTTP Source URL where you want to send your logs.
      You should follow the `https://<SumoEndpoint>/receiver/v1/http` format and set
      the collector code in the `collectorCode` member.

      '
    type: string
required:
- destinationType
- displayName
- endpoint
- compressLogs
title: SUMO_LOGIC
type: object
x-akamai:
  file-path: schemas/sumo-logic-saved-destination.yaml
