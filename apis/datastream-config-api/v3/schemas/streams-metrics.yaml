additionalProperties: false
description: 'Provides log file upload metrics for streams.

  '
properties:
  fileUploadMetrics:
    description: 'Provides detailed log file upload metrics for streams.

      '
    items:
      additionalProperties: false
      properties:
        aggregationTime:
          description: 'The start time of the metrics aggregation time interval in
            the ISO 8601 format. For example, for an `aggregationInterval` set to
            `FIVE_MINUTE`, `aggregationTime` returns `2022-05-10T10:05:00` for metrics
            between `2022-05-10T10:05:00` and `2022-05-10T10:09:59`.

            '
          format: date-time
          type: string
        failedUploadAttempts:
          description: 'Lists the upload `errorCount` per specific `errorCode`.

            '
          items:
            additionalProperties: false
            properties:
              errorCode:
                description: 'The upload error code returned by the stream.

                  '
                type: string
              errorCount:
                description: 'The number of occurences of the error code.

                  '
                type: integer
            required:
            - errorCode
            - errorCount
            type: object
          type: array
        latencyBuckets:
          description: 'Delivery buckets that specify the number of records the logging
            server delivered to the Akamai upload server within a `latencyInSeconds`
            range.

            '
          items:
            additionalProperties: false
            properties:
              latencyInSeconds:
                description: 'The latency for record delivery in seconds. The number
                  is the minimum value in a latency range, for example, `60` indicates
                  latency between `60` and `120` seconds.

                  '
                enum:
                - 0
                - 30
                - 60
                - 120
                - 300
                type: integer
              recordsCount:
                description: 'The number of records delivered within the specified
                  latency range.

                  '
                type: integer
            required:
            - latencyInSeconds
            - recordsCount
            type: object
          type: array
        recordsAttemptedUpload:
          description: 'The total number of log records attempted to upload.

            '
          minimum: 0
          type: integer
        recordsFailedUpload:
          description: 'The number of log records that failed to upload.

            '
          minimum: 0
          type: integer
        streamId:
          description: 'Uniquely identifies the stream you want to view metrics for.

            '
          type: integer
        successUploadsCount:
          description: 'The number of successful log uploads in the aggregation time
            interval.

            '
          minimum: 0
          type: integer
        uploadBuckets:
          description: 'Upload buckets specyfing the number of records delivered from
            the Akamai upload server to the client-defined sink with an upload time.

            '
          items:
            additionalProperties: false
            properties:
              recordsCount:
                description: 'The number of records uploaded during the `uploadTimeInMilliseconds`.
                  This is the minimum value in a range, for example, `60` indicates
                  between `60` and `120` records.

                  '
                minimum: 0
                type: integer
              uploadTimeInMilliseconds:
                description: 'The upload time for record delivery in milliseconds.
                  The number is the minimum value in a time range, for example, `120000`
                  indicates latency between `120000` and `300000` milliseconds.

                  '
                enum:
                - 0
                - 30000
                - 60000
                - 120000
                - 300000
                - 600000
                - 1800000
                type: integer
            required:
            - uploadTimeInMilliseconds
            - recordsCount
            type: object
          type: array
        uploadedBytes:
          description: 'The volume of uploaded data in bytes.

            '
          minimum: 0
          type: integer
      required:
      - aggregationTime
      - streamId
      - successUploadsCount
      - failedUploadAttempts
      type: object
    type: array
  totalErrorCount:
    description: 'The total number log upload failures between the `start` and `end`
      date.

      '
    minimum: 0
    type: integer
  totalSuccessCount:
    description: 'The total number of successful log uploads between the `start` and
      `end` date.

      '
    minimum: 0
    type: integer
  totalUploadCount:
    description: 'The total number of log uploads between the `start` and `end` date.

      '
    minimum: 0
    type: integer
type: object
x-akamai:
  file-path: schemas/streams-metrics.yaml
