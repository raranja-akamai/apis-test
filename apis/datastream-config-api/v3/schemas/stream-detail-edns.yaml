additionalProperties: false
description: 'Details the latest configuration version of an Edge DNS stream. It provides
  descriptions of the data set fields selected in the version, identifiers of zones
  they collect logs for, configuration of the destination where they deliver logs,
  and structure of these log lines. It also informs whether this version is active.

  '
properties:
  contractId:
    description: 'Identifies the contract the stream belongs to.

      '
    type: string
  createdBy:
    description: 'The username who created the stream.

      '
    type: string
  createdDate:
    description: 'An ISO 8601 timestamp marking when the stream was created.

      '
    format: date-time
    type: string
  datasetFields:
    description: 'Lists currently selected data set fields the stream monitors in
      logs. The order of the identifiers determines how these fields'' values appear
      in log lines.

      '
    items:
      additionalProperties: false
      properties:
        datasetFieldId:
          description: 'Identifies the field.

            '
          type: integer
        datasetFieldJsonKey:
          description: 'Specifies the JSON key for the field in a log line. You can
            get this value only when you run the [List data set fields](ref:get-dataset-fields)
            or [Get a stream](ref:get-stream) operation for a stream in the `JSON`
            format.

            '
          type: string
        datasetFieldName:
          description: 'The data set field''s name.

            '
          type: string
      required:
      - datasetFieldId
      - datasetFieldName
      - datasetFieldJsonKey
      type: object
    type: array
  deliveryConfiguration:
    additionalProperties: false
    description: 'The configuration of log filenames, and their delivery frequency
      to the destination.

      '
    properties:
      fieldDelimiter:
        description: 'A delimiter that separates data set fields in the log lines,
          either `SPACE` or `TAB`. Set this only for the `STRUCTURED` log file `format`.

          '
        enum:
        - SPACE
        - TAB
        type: string
      format:
        description: 'The format in which you want to receive log files. You can choose
          the `STRUCTURED` or `JSON` format for your stream.

          '
        enum:
        - STRUCTURED
        - JSON
        type: string
      frequency:
        additionalProperties: false
        description: 'The frequency to collect logs from each uploader and send them
          to a destination.

          '
        properties:
          intervalInSeconds:
            description: 'The interval in seconds (`30` or `60`) after which the system
              bundles log lines into a file and sends it to a destination.

              '
            enum:
            - 30
            - 60
            type: integer
        required:
        - intervalInSeconds
        type: object
      uploadFilePrefix:
        default: ak
        description: 'The log filename prefix that you want to send to an object-based
          destination, up to 200 characters. This data supports [Dynamic time variables](ref:custom-log-field#dynamic-time-variables).
          If unspecified, it defaults to `ak`.

          '
        maxLength: 200
        type: string
      uploadFileSuffix:
        default: ds
        description: 'The log filename suffix that you want to send to an object-based
          destination, up to 10 characters. This data supports [Dynamic time variables](ref:custom-log-field#dynamic-time-variables).
          If unspecified, it defaults to `ds`.

          '
        maxLength: 10
        type: string
    required:
    - format
    - frequency
    type: object
  destination:
    description: 'Details the destination''s configuration in the stream to send logs.

      '
    oneOf:
    - $ref: azure-saved-destination.yaml
    - $ref: s3saved-destination.yaml
    - $ref: datadog-saved-destination.yaml
    - $ref: splunk-saved-destination.yaml
    - $ref: gcs-saved-destination.yaml
    - $ref: https-saved-destination.yaml
    - $ref: ocs-saved-destination.yaml
    - $ref: sumo-logic-saved-destination.yaml
    - $ref: loggly-saved-destination.yaml
    - $ref: elasticsearch-saved-destination.yaml
    - $ref: new-relic-saved-destination.yaml
    - $ref: s3compatible-saved-destination.yaml
    - $ref: traffic-peak-saved-destination.yaml
    - $ref: dynatrace-saved-destination.yaml
  groupId:
    description: 'Identifies the group with access to the product, which you created
      the stream configuration for. You can write this data only once, when you initially
      create the stream.

      '
    type: integer
  latestVersion:
    description: 'Identifies the stream''s latest configuration version.

      '
    type: integer
  modifiedBy:
    description: 'The username who modified the stream.

      '
    type: string
  modifiedDate:
    description: 'An ISO 8601 timestamp marking when the stream was modified.

      '
    format: date-time
    type: string
  notificationEmails:
    description: 'Email addresses where the system sends notifications about activations
      and deactivations of the stream.

      '
    items:
      type: string
    minItems: 0
    type: array
  streamId:
    description: 'Identifies the stream.

      '
    type: integer
  streamName:
    description: 'The stream''s name.

      '
    type: string
  streamStatus:
    description: 'Indicates if the stream is `INACTIVE`, `ACTIVATING`, `ACTIVATED`,
      `DEACTIVATING`, or `DEACTIVATED`.

      '
    enum:
    - INACTIVE
    - ACTIVATING
    - ACTIVATED
    - DEACTIVATING
    - DEACTIVATED
    type: string
  streamVersion:
    description: 'Identifies the stream''s configuration version.

      '
    type: integer
  zones:
    description: 'Identifies the Edge DNS zones you monitor in the stream.

      '
    items:
      additionalProperties: false
      properties:
        zoneId:
          description: 'The identifier of the zone.

            '
          type: integer
        zoneName:
          description: 'The zone''s descriptive label.

            '
          type: string
      required:
      - zoneId
      - zoneName
      type: object
    type: array
required:
- contractId
- createdBy
- createdDate
- datasetFields
- deliveryConfiguration
- destination
- groupId
- latestVersion
- modifiedBy
- modifiedDate
- streamId
- streamName
- streamStatus
- streamVersion
- zones
title: Edge DNS stream details
type: object
x-akamai:
  file-path: schemas/stream-detail-edns.yaml
