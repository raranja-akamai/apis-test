additionalProperties: false
description: 'Provides detailed information about the Splunk connector that you can
  use in your stream. Note that DataStream 2 supports only endpoint URLs ending with
  `collector/raw` at this time.

  '
properties:
  compressLogs:
    default: true
    description: 'Enables gzip compression for a log file sent to a destination. If
      not set, this member''s value is `true` by default.

      '
    type: boolean
  connectorId:
    description: 'Identifies the connector associated with the data stream.

      '
    type: integer
  connectorName:
    description: 'The name of the connector.

      '
    type: string
  connectorType:
    description: 'The name of the connector type. Set this value to `SPLUNK` for this
      connector type.

      '
    enum:
    - SPLUNK
    type: string
  customHeaderName:
    description: 'A human-readable name for the request''s custom header, containing
      only alphanumeric, dash, and underscore characters.

      '
    type: string
  customHeaderValue:
    description: 'The custom header''s contents passed with the request that contains
      information about the client connection.

      '
    type: string
  mTLS:
    description: 'Identifies if the stream has the mTLS authentication enabled. The
      response returns this field only if you pass the `clientCert` and `clientKey`
      members while creating or editing a stream.

      '
    type: string
  tlsHostname:
    description: 'The hostname that verifies the server''s certificate and matches
      the Subject Alternative Names (SANs) in the certificate. If not provided, DataStream
      fetches the hostname from the endpoint URL.

      '
    type: string
  url:
    description: 'The raw event Splunk URL where you want to store your logs. You
      can use Akamaized property hostnames as endpoint URLs. See [Stream logs to Splunk](doc:stream-splunk#akamaized-hostname-as-endpoint).

      '
    type: string
required:
- connectorId
- connectorType
- connectorName
- url
- compressLogs
title: SPLUNK
type: object
x-akamai:
  file-path: schemas/splunk-saved-connector.yaml
