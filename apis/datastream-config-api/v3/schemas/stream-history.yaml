additionalProperties: false
description: 'Provides detailed information about the latest configuration version
  of a data stream. It provides descriptions of the data set fields selected in the
  version, identifiers of properties they collect logs for, configuration of the destination
  where they deliver logs, and structure of these log lines. It also informs whether
  this version is active.

  '
properties:
  activationStatus:
    description: 'The activation status of the data stream configuration version.
      These are possible values: `INACTIVE`, `ACTIVATING`, `ACTIVATED`, `DEACTIVATING`,
      or `DEACTIVATED`. See the [Activate a stream](ref:put-stream-activate) and [Deactivate
      a stream](ref:put-stream-deactivate).

      operations.

      '
    enum:
    - INACTIVE
    - ACTIVATING
    - ACTIVATED
    - DEACTIVATING
    - DEACTIVATED
    type: string
  collectMidgress:
    description: 'Indicates if you have opted to capture midgress traffic within the
      Akamai platform, such as between two edge serves.

      '
    type: boolean
  config:
    additionalProperties: false
    description: 'The configuration of log lines, names of the files sent to a destination,
      and delivery frequency for these files.

      '
    properties:
      delimiter:
        description: 'A delimiter that you use to separate data set fields in log
          lines. `SPACE` is the only delimiter currently available. This field is
          required only for the STRUCTURED log file format.

          '
        enum:
        - SPACE
        type: string
      format:
        description: 'The format in which you want to receive log files. `STRUCTURED`
          or `JSON` are the currently available formats.

          '
        enum:
        - STRUCTURED
        - JSON
        type: string
      frequency:
        additionalProperties: false
        description: 'The frequency of collecting logs from each uploader and sending
          these logs to a destination.

          '
        properties:
          timeInSec:
            description: 'The number of seconds after which the system bundles log
              lines into a file and sends it to a destination. Possible values are
              `30` or `60`.

              '
            enum:
            - 30
            - 60
            type: integer
        type: object
      uploadFilePrefix:
        description: 'The prefix of the log file that you want to send to a destination.
          It''s a string of at most 200 characters. If unspecified, it defaults to
          `ak`.

          '
        type: string
      uploadFileSuffix:
        description: 'The suffix of the log file that you want to send to a destination.
          It''s a static string of at most 10 characters. If unspecified, it defaults
          to `ds`.

          '
        type: string
    type: object
  connectors:
    description: 'Provides detailed information about the connector''s configuration.
      At this time, you can configure one connector per stream as the destination
      to send logs.

      '
    items:
      oneOf:
      - $ref: azure-saved-connector.yaml
      - $ref: s3saved-connector.yaml
      - $ref: datadog-saved-connector.yaml
      - $ref: splunk-saved-connector.yaml
      - $ref: gcssaved-connector.yaml
      - $ref: httpssaved-connector.yaml
      - $ref: sumo-logic-saved-connector.yaml
      - $ref: ocssaved-connector.yaml
      - $ref: loggly-saved-connector.yaml
    type: array
  contractId:
    description: 'Identifies the contract that you created the stream for.

      '
    type: string
  createdBy:
    description: 'The username who created the stream.

      '
    type: string
  createdDate:
    description: 'An ISO 8601 timestamp marking when the stream was created.

      '
    format: date-time
    type: string
  datasets:
    items:
      $ref: detailed-data-sets.yaml
      description: 'A list of data set fields selected from the associated that template
        the stream monitors in logs.

        '
    type: array
  emailIds:
    description: 'A comma-delimited list of email addresses where the system sends
      notifications about activations and deactivations of the stream.

      '
    type: string
  groupId:
    description: 'Identifies the group that has access to the product and that you
      created the stream configuration for.

      '
    type: integer
  groupName:
    description: 'The name of the user group that you created the stream for.

      '
    type: string
  modifiedBy:
    description: 'The username who modified the stream.

      '
    type: string
  modifiedDate:
    description: 'An ISO 8601 timestamp marking when the stream was modified.

      '
    type: string
  productId:
    description: 'The ID of the product that you created stream for.

      '
    type: string
  productName:
    description: 'The name of the product that you created this stream for.

      '
    type: string
  properties:
    items:
      $ref: property.yaml
      description: 'Identifies the properties that you monitor in the stream.

        '
    type: array
  streamId:
    description: 'Identifies the stream.

      '
    type: integer
  streamName:
    description: 'The name of the stream.

      '
    type: string
  streamType:
    description: 'Specifies the type of the data stream. `RAW_LOGS` is the only possible
      stream type currently available.

      '
    enum:
    - RAW_LOGS
    type: string
  streamVersionId:
    description: 'Identifies the configuration version of the stream.

      '
    type: integer
  templateName:
    description: 'The name of the template you assigned to the stream. `RAW_LOGS`
      is the only template currently available.

      '
    enum:
    - RAW_LOGS
    type: string
required:
- streamId
- streamVersionId
- streamName
- datasets
- connectors
- productId
- productName
- templateName
- config
- groupId
- groupName
- contractId
- properties
- streamType
- activationStatus
- createdBy
- createdDate
- modifiedBy
- modifiedDate
type: object
x-akamai:
  file-path: schemas/stream-history.yaml
