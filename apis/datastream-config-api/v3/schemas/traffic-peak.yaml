additionalProperties: false
description: 'Details the TrafficPeak endpoint you can use as a destination for a
  stream, including basic authentication. Choosing TrafficPeak for delivery streams
  requires logging the **Request time** (ID: `1100`) data set field. For Edge DNS
  and GTM streams, it requires the **Epoch timestamp** (ID: `4002` and `5002` respectively)
  field. If you choose this destination, the stream pushes a sample `{"access_validation":true}`
  POST request to the endpoint to validate write access. You can see the data only
  if the destination validates, and you can access the destination storage.

  '
properties:
  authenticationType:
    description: 'For basic authentication, provide the username and password you
      set in your TrafficPeak endpoint.

      '
    enum:
    - BASIC
    type: string
  compressLogs:
    default: true
    description: 'Enables gzip compression for a log file sent to a destination. The
      value is `true` by default.

      '
    type: boolean
  contentType:
    description: 'The type of the resource passed in the request''s custom header.
      For details, see the additional options discussed in [Stream logs to a TrafficPeak
      endpoint](doc:stream-trafficpeak#additional-options).

      '
    type: string
  customHeaderName:
    description: 'A human-readable name for the request''s custom header, containing
      only alphanumeric, dash, and underscore characters. For details, see the additional
      options discussed in [Stream logs to a TrafficPeak endpoint](doc:stream-trafficpeak#additional-options).

      '
    type: string
  customHeaderValue:
    description: 'The custom header''s contents passed with the request that contains
      information about the client connection. For details, see the additional options
      discussed in [Stream logs to a TrafficPeak endpoint](doc:stream-trafficpeak#additional-options).

      '
    type: string
  destinationType:
    description: 'The destination type''s name. Set it to `TRAFFICPEAK` for this destination
      type.

      '
    enum:
    - TRAFFICPEAK
    type: string
  displayName:
    description: 'The destination''s name.

      '
    type: string
  endpoint:
    description: 'Enter the Hydrolix endpoint URL in the `https://<host>/ingest/event?table=<tablename>&token=<token>`
      format, where the `token` is the HTTP streaming ingest token, and the `tablename`
      is the Hydrolix data set table name.

      '
    type: string
  password:
    description: 'Enter the password you set in your TrafficPeak endpoint for authentication.

      '
    type: string
  userName:
    description: 'Enter the valid username you set in your TrafficPeak endpoint for
      authentication.

      '
    type: string
required:
- destinationType
- displayName
- authenticationType
- endpoint
- userName
- password
- contentType
- compressLogs
title: TRAFFICPEAK
type: object
