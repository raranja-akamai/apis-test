additionalProperties: false
description: 'Specifies a user.

  '
properties:
  address:
    description: 'The user''s street address.

      '
    type: string
  authGrants:
    description: 'The user''s role assignments, per group.

      '
    items:
      $ref: auth-grant-request.yaml
    type: array
  city:
    description: 'The user''s city.

      '
    type: string
  cloneFrom:
    description: 'The username to clone a user''s `authGrants` from. If you provide
      this member in a POST request, don''t include the `authGrants` member in the
      request too.

      '
    type: string
  contactType:
    description: 'To help characterize the user, this can be any value available from
      the [View contact](ref:get-common-contact-types) types operation.

      '
    type: string
  country:
    description: 'Part of the user''s location. This can be any value available from
      the [View supported countries](ref:get-common-countries) operation.

      '
    type: string
  email:
    description: 'The user''s email address.

      '
    format: email
    type: string
  firstName:
    description: 'The user''s first name.

      '
    type: string
  jobTitle:
    description: 'The user''s job title.

      '
    type: string
  lastName:
    description: 'The user''s last name.

      '
    type: string
  mobilePhone:
    description: 'The user''s mobile phone number, represented as a 10-digit integer
      within a string.

      '
    type: string
  notifications:
    additionalProperties: false
    description: 'Emails the user can receive for their products.

      '
    properties:
      enableEmailNotifications:
        description: 'Enables email notifications.

          '
        type: boolean
      options:
        additionalProperties: false
        description: 'Email settings.

          '
        properties:
          newUserNotification:
            description: 'Email notification for new user creation.

              '
            type: boolean
          passwordExpiry:
            description: 'Email notifications for password expirations.

              '
            type: boolean
          proactive:
            description: 'Email notifications for proactive maintenance to products.

              '
            items:
              description: 'Product names.

                '
              type: string
            type: array
          upgrade:
            description: 'Email notifications for upgrades to products.

              '
            items:
              description: 'Product names.

                '
              type: string
            type: array
        type: object
    type: object
  phone:
    description: 'The user''s main phone number, represented as a ten-digit integer
      within a string.

      '
    type: string
  preferredLanguage:
    description: 'This can be any value available from the [View languages](ref:get-common-languages)
      operation.

      '
    type: string
  secondaryEmail:
    description: 'The user''s alternate email address.

      '
    format: email
    type: string
  sessionTimeOut:
    description: 'The number of seconds it takes for the user''s Control Center session
      to time out if there hasn''t been any activity. This corresponds to the value
      from the [View timeout policies](ref:get-common-timeout-policies) operation''s
      response.

      '
    type: integer
  state:
    description: 'The name of the state where the user is located.

      '
    type: string
  tfaEnabled:
    description: 'When enabled, two-factor authentication confirms the user''s identity.

      '
    type: boolean
  timeZone:
    description: 'The user''s time zone. The value can be any that are available from
      the [View time zones](ref:get-common-timezones) operation.

      '
    type: string
  timezone:
    description: 'The user''s time zone. The value can be any that are available from
      the [View time zones](ref:get-common-timezones) operation.

      '
    type: string
  zipCode:
    description: 'The user''s five-digit ZIP code, represented as a string.

      '
    type: string
required:
- firstName
- lastName
- email
- phone
- country
- authGrants
type: object
x-akamai:
  file-path: schemas/create-user-request.yaml
