additionalProperties: false
description: Specifies credentials.
properties:
  clientToken:
    description: 'Identifies the API client.

      '
    type: string
  createdOn:
    description: '__Read-only__ ISO 8601 timestamp indicating when credentials were
      created.

      '
    format: date-time
    readOnly: true
    type: string
  credentialId:
    description: 'A unique identifier for each credential.

      '
    type: integer
  description:
    description: 'Notes or description for credentials.

      '
    type: string
  expiresOn:
    description: '__Read-only__ ISO 8601 timestamp indicating when the credential
      expire. By default, two years from the creation date.

      '
    format: date-time
    readOnly: true
    type: string
  status:
    description: 'Identifies the condition of the credential.

      '
    type: string
required:
- expiresOn
- status
- credentialId
- clientToken
- createdOn
- description
type: object
x-akamai:
  file-path: schemas/update-credential.yaml
