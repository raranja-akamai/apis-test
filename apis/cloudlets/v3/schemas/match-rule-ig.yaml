additionalProperties: false
description: Contains match rule information for Request Control.
properties:
  akaRuleId:
    description: '__Read-only__ __Read-only__ The rule''s unique identifier within
      the policy version.

      '
    readOnly: true
    type: string
  allowDeny:
    description: 'If set to `allow`, the request is sent to origin when all conditions
      are true. If `deny`, the request is denied when all conditions are true. If
      `denybranded`, the request is denied and rerouted according to the configuration
      of the [Request Control behavior](https://techdocs.akamai.com/property-mgr/reference/latest-request-control).

      '
    enum:
    - allow
    - deny
    - denybranded
    type: string
  disabled:
    default: false
    description: 'If `true`, disables a rule so it''s not evaluated against incoming
      requests. The default setting is `false`.

      '
    type: boolean
  end:
    default: 0
    description: 'The end time for this match rule in epoch seconds. When `end` is
      `0`, there is no end time for this match rule.

      '
    minimum: 0
    type: integer
  id:
    description: '__Read-only__ __Read-only__ Akamai internal use only.

      '
    nullable: true
    readOnly: true
    type: integer
  location:
    description: '__Read-only__ __Read-only__ The navigable endpoint used for the
      object referred to in the operation.

      '
    readOnly: true
    type: string
  matches:
    description: 'The `matchType` and the `matchValue` or `objectMatchValue` used
      to conditionally pass through the request. Plus additional criteria to match
      on, like case sensitivity (`caseSensitive`).

      '
    items:
      $ref: match-rule-ig-definitions.yaml#/definitions/matchCriteriaType
    nullable: true
    type: array
  matchesAlways:
    description: 'The match rule always applies when `true`. When `false`, the rule
      applies within the `start` and `end` time range.

      '
    type: boolean
  name:
    description: 'The name of the rule.

      '
    maxLength: 8192
    nullable: true
    type: string
  start:
    default: 0
    description: 'The start time for this match rule in epoch seconds. When `start`
      is `0`, the match rule is on.

      '
    minimum: 0
    type: integer
  type:
    description: 'The type of Cloudlet the rule is for. For example, the string for
      Request Control is `igMatchRule`.

      '
    enum:
    - igMatchRule
    type: string
required:
- type
- allowDeny
title: Request Control
type: object
x-akamai:
  file-path: schemas/match-rule-ig.yaml
